<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Groq AI Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0f;
    --surface:  #12121a;
    --card:     #1a1a26;
    --border:   #2a2a3d;
    --accent:   #7c6aff;
    --accent2:  #ff6a9e;
    --accent3:  #6affda;
    --text:     #e8e6ff;
    --muted:    #6b6a8a;
    --user-bg:  linear-gradient(135deg, #7c6aff, #ff6a9e);
    --bot-bg:   #1e1e2e;
    --glow:     0 0 40px rgba(124,106,255,0.15);
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ── Animated background ── */
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 10% 0%, rgba(124,106,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 100%, rgba(255,106,158,0.10) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 50% 50%, rgba(106,255,218,0.05) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Layout ── */
  #app {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    height: 100vh; max-width: 820px;
    margin: 0 auto;
  }

  /* ── Header ── */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 24px;
    background: rgba(18,18,26,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .avatar {
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 20px rgba(124,106,255,0.4);
    animation: pulse-glow 3s ease-in-out infinite;
  }
  @keyframes pulse-glow {
    0%,100% { box-shadow: 0 4px 20px rgba(124,106,255,0.4); }
    50%      { box-shadow: 0 4px 30px rgba(124,106,255,0.7), 0 0 50px rgba(255,106,158,0.2); }
  }

  .header-info h1 {
    font-family: 'Syne', sans-serif;
    font-size: 16px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    letter-spacing: -0.3px;
  }
  .header-info .status {
    font-size: 12px; color: var(--accent3);
    display: flex; align-items: center; gap: 5px;
    margin-top: 2px;
  }
  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent3);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100% { opacity:1; } 50% { opacity:0.3; }
  }

  .header-actions { margin-left: auto; display: flex; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; transition: all 0.2s;
  }
  .icon-btn:hover { background: var(--border); color: var(--text); }

  /* ── Model badge ── */
  .model-badge {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 20px;
    background: rgba(124,106,255,0.12);
    border: 1px solid rgba(124,106,255,0.3);
    font-size: 11px; color: var(--accent);
    font-family: 'Syne', sans-serif; font-weight: 600;
    letter-spacing: 0.5px;
  }

  /* ── Messages area ── */
  #messages {
    flex: 1; overflow-y: auto;
    padding: 24px 20px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Welcome screen ── */
  #welcome {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; gap: 16px; text-align: center;
    padding: 40px 20px;
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .welcome-icon {
    width: 72px; height: 72px; border-radius: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
    box-shadow: 0 8px 40px rgba(124,106,255,0.4);
  }
  #welcome h2 {
    font-family: 'Syne', sans-serif;
    font-size: 26px; font-weight: 800;
    background: linear-gradient(135deg, var(--text), var(--accent));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  #welcome p {
    color: var(--muted); font-size: 14px; max-width: 320px; line-height: 1.6;
  }

  .quick-btns {
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-top: 8px;
  }
  .quick-btn {
    padding: 8px 16px; border-radius: 20px;
    background: var(--card); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.2s;
  }
  .quick-btn:hover {
    background: rgba(124,106,255,0.2);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  /* ── Message bubbles ── */
  .msg-row {
    display: flex; gap: 10px;
    animation: msgIn 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes msgIn {
    from { opacity:0; transform:translateY(10px) scale(0.97); }
    to   { opacity:1; transform:translateY(0) scale(1); }
  }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 10px;
    flex-shrink: 0; display: flex; align-items: center;
    justify-content: center; font-size: 16px;
    margin-top: 2px;
  }
  .msg-row.bot .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
  }
  .msg-row.user .msg-avatar {
    background: var(--card); border: 1px solid var(--border);
  }

  .msg-content { max-width: 72%; display: flex; flex-direction: column; gap: 4px; }
  .msg-row.user .msg-content { align-items: flex-end; }

  .bubble {
    padding: 12px 16px; border-radius: 18px;
    font-size: 14px; line-height: 1.65;
    word-break: break-word;
  }
  .msg-row.user .bubble {
    background: var(--user-bg);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 20px rgba(124,106,255,0.3);
  }
  .msg-row.bot .bubble {
    background: var(--bot-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    color: var(--text);
  }

  /* Code blocks inside bot bubbles */
  .bubble pre {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 12.5px;
    line-height: 1.6;
  }
  .bubble code {
    font-family: 'Fira Code', 'Courier New', monospace;
    font-size: 13px;
    background: rgba(124,106,255,0.15);
    padding: 2px 6px; border-radius: 4px;
    color: var(--accent3);
  }
  .bubble pre code {
    background: none; padding: 0; color: #c9d1d9;
  }

  .msg-time {
    font-size: 11px; color: var(--muted); padding: 0 4px;
  }

  /* ── Typing indicator ── */
  .typing-dots {
    display: flex; gap: 5px; align-items: center;
    padding: 14px 18px;
  }
  .typing-dots span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    animation: dot-bounce 1.2s ease-in-out infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%,60%,100% { transform: translateY(0); opacity:0.4; }
    30%          { transform: translateY(-6px); opacity:1; }
  }

  /* ── Input area ── */
  #input-area {
    padding: 14px 20px 20px;
    background: rgba(18,18,26,0.9);
    backdrop-filter: blur(20px);
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .input-wrapper {
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px 14px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-wrapper:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.12), var(--glow);
  }

  #user-input {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.5;
    resize: none; max-height: 140px;
    scrollbar-width: none;
  }
  #user-input::placeholder { color: var(--muted); }
  #user-input::-webkit-scrollbar { display: none; }

  #send-btn {
    width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; color: white; font-size: 16px;
  }
  #send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 20px rgba(124,106,255,0.5); }
  #send-btn:active { transform: scale(0.96); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .input-hint {
    text-align: center; font-size: 11px; color: var(--muted);
    margin-top: 8px;
  }

  /* ── Error toast ── */
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #ff4466; color: #fff; padding: 10px 20px;
    border-radius: 12px; font-size: 13px; z-index: 999;
    display: none; animation: fadeUp 0.3s ease;
  }

  /* ── Config modal ── */
  #config-modal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
    align-items: center; justify-content: center;
  }
  #config-modal.open { display: flex; }
  .modal-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 28px; width: 90%; max-width: 420px;
    animation: fadeUp 0.3s ease;
  }
  .modal-box h3 {
    font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700;
    margin-bottom: 20px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group select {
    width: 100%; padding: 10px 14px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .form-group select option { background: var(--surface); }
  .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
  .btn-primary {
    flex: 1; padding: 11px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: white; font-family: 'Syne', sans-serif;
    font-weight: 700; font-size: 14px; cursor: pointer;
    transition: opacity 0.2s;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-secondary {
    padding: 11px 20px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 14px; cursor: pointer; transition: background 0.2s;
  }
  .btn-secondary:hover { background: var(--border); }

  @media (max-width: 600px) {
    header { padding: 14px 16px; }
    #messages { padding: 16px 14px; }
    #input-area { padding: 12px 14px 16px; }
    .msg-content { max-width: 85%; }
  }
</style>
</head>
<body>

<div id="app">

  <!-- Header -->
  <header>
    <div class="avatar">🤖</div>
    <div class="header-info">
      <h1>Groq AI Chat</h1>
      <div class="status"><span class="status-dot"></span> Ishlayapti</div>
    </div>
    <div class="model-badge">⚡ Llama 3.1</div>
    <div class="header-actions">
      <button class="icon-btn" onclick="clearChat()" title="Tozalash">🗑</button>
      <button class="icon-btn" onclick="openConfig()" title="Sozlamalar">⚙️</button>
    </div>
  </header>

  <!-- Messages -->
  <div id="messages">
    <div id="welcome">
      <div class="welcome-icon">✨</div>
      <h2>Salom! Men bu yerdaman</h2>
      <p>Groq AI bilan ishlaydiigan tez va aqlli chatbot. Savol bering yoki quyidagilardan birini tanlang.</p>
      <div class="quick-btns">
        <button class="quick-btn" onclick="quickSend('Salom! O\'zing haqida gapirib ber')">👋 Tanishish</button>
        <button class="quick-btn" onclick="quickSend('HTML kod yozib bera olasanmi?')">💻 Kod yozish</button>
        <button class="quick-btn" onclick="quickSend('Bugun nima qilsam bo\'ladi?')">💡 Taklif ber</button>
        <button class="quick-btn" onclick="quickSend('Ingliz tilini o\'rganishga yordam ber')">📚 O\'rganish</button>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div id="input-area">
    <div class="input-wrapper">
      <textarea
        id="user-input"
        placeholder="Xabar yozing... (Enter — yuborish, Shift+Enter — yangi qator)"
        rows="1"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()">➤</button>
    </div>
    <div class="input-hint">Groq API kalitini ⚙️ sozlamalardan kiriting</div>
  </div>

</div>

<!-- Config Modal -->
<div id="config-modal">
  <div class="modal-box">
    <h3>⚙️ Sozlamalar</h3>
    <div class="form-group">
      <label>GROQ API KEY</label>
      <input type="password" id="api-key-input" placeholder="gsk_..." />
    </div>
    <div class="form-group">
      <label>MODEL</label>
      <select id="model-select">
        <option value="llama-3.1-8b-instant">⚡ Llama 3.1 8B (Eng tez)</option>
        <option value="llama-3.1-70b-versatile" selected>🧠 Llama 3.1 70B (Eng aqlli)</option>
        <option value="llama3-8b-8192">🚀 Llama 3 8B</option>
        <option value="mixtral-8x7b-32768">🌀 Mixtral 8x7B</option>
        <option value="gemma2-9b-it">💎 Gemma 2 9B</option>
      </select>
    </div>
    <div class="form-group">
      <label>TIZIM XABARI (System Prompt)</label>
      <input type="text" id="system-input"
        value="Sen yordamchi AI assistantsan. O'zbek, Rus va Ingliz tillarida javob ber." />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeConfig()">Bekor</button>
      <button class="btn-primary" onclick="saveConfig()">Saqlash ✓</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── State ────────────────────────────────────────────────────────────────────
  let config = {
    apiKey: localStorage.getItem('groq_key') || '',
    model:  localStorage.getItem('groq_model') || 'llama-3.1-70b-versatile',
    system: localStorage.getItem('groq_system') || "Sen yordamchi AI assistantsan. O'zbek, Rus va Ingliz tillarida javob ber."
  };
  let history = [];
  let isLoading = false;

  // ── Auto-resize textarea ──────────────────────────────────────────────────
  const textarea = document.getElementById('user-input');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 140) + 'px';
  });
  textarea.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // ── Send message ─────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = textarea.value.trim();
    if (!text || isLoading) return;

    if (!config.apiKey) {
      showToast('⚠️ Avval API kalitni kiriting (⚙️ tugmasi)');
      openConfig(); return;
    }

    hideWelcome();
    appendMessage('user', text);
    history.push({ role: 'user', content: text });
    textarea.value = '';
    textarea.style.height = 'auto';

    isLoading = true;
    document.getElementById('send-btn').disabled = true;

    const typingId = showTyping();

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.apiKey}`
        },
        body: JSON.stringify({
          model: config.model,
          messages: [
            { role: 'system', content: config.system },
            ...history
          ],
          max_tokens: 2048,
          temperature: 0.7,
          stream: false
        })
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.error?.message || `HTTP ${res.status}`);
      }

      const data = await res.json();
      const reply = data.choices[0].message.content;

      history.push({ role: 'assistant', content: reply });
      if (history.length > 40) history = history.slice(-40);

      removeTyping(typingId);
      appendMessage('bot', reply);

    } catch (err) {
      removeTyping(typingId);
      appendMessage('bot', `❌ Xato: ${err.message}`);
    }

    isLoading = false;
    document.getElementById('send-btn').disabled = false;
    textarea.focus();
  }

  function quickSend(text) {
    textarea.value = text;
    sendMessage();
  }

  // ── Render messages ──────────────────────────────────────────────────────
  function appendMessage(role, text) {
    const msgs = document.getElementById('messages');
    const row  = document.createElement('div');
    row.className = `msg-row ${role}`;

    const now  = new Date().toLocaleTimeString('uz-UZ', { hour:'2-digit', minute:'2-digit' });
    const html = markdownToHtml(text);

    row.innerHTML = `
      <div class="msg-avatar">${role === 'bot' ? '🤖' : '👤'}</div>
      <div class="msg-content">
        <div class="bubble">${html}</div>
        <span class="msg-time">${now}</span>
      </div>`;

    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById('messages');
    const row  = document.createElement('div');
    const id   = 'typing_' + Date.now();
    row.id     = id;
    row.className = 'msg-row bot';
    row.innerHTML = `
      <div class="msg-avatar">🤖</div>
      <div class="msg-content">
        <div class="bubble">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      </div>`;
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
    return id;
  }

  function removeTyping(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
  }

  function hideWelcome() {
    const w = document.getElementById('welcome');
    if (w) w.remove();
  }

  // ── Simple markdown → HTML ───────────────────────────────────────────────
  function markdownToHtml(text) {
    return text
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/^### (.+)$/gm, '<h4 style="margin:8px 0 4px;font-size:14px;color:#c9b8ff">$1</h4>')
      .replace(/^## (.+)$/gm,  '<h3 style="margin:8px 0 4px;font-size:15px;color:#c9b8ff">$1</h3>')
      .replace(/^# (.+)$/gm,   '<h2 style="margin:8px 0 4px;font-size:16px;color:#c9b8ff">$1</h2>')
      .replace(/^[-*] (.+)$/gm, '<li style="margin-left:16px">$1</li>')
      .replace(/\n/g, '<br>');
  }

  // ── Clear chat ──────────────────────────────────────────────────────────
  function clearChat() {
    history = [];
    const msgs = document.getElementById('messages');
    msgs.innerHTML = `
      <div id="welcome" style="display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;text-align:center;padding:40px 20px;animation:fadeUp 0.6s ease both">
        <div class="welcome-icon">✨</div>
        <h2>Yangi suhbat boshlandi</h2>
        <p>Savolingizni bering yoki quyidagilardan birini tanlang.</p>
        <div class="quick-btns">
          <button class="quick-btn" onclick="quickSend('Salom! O\\'zing haqida gapirib ber')">👋 Tanishish</button>
          <button class="quick-btn" onclick="quickSend('HTML kod yozib bera olasanmi?')">💻 Kod yozish</button>
          <button class="quick-btn" onclick="quickSend('Bugun nima qilsam bo\\'ladi?')">💡 Taklif ber</button>
          <button class="quick-btn" onclick="quickSend('Ingliz tilini o\\'rganishga yordam ber')">📚 O\\'rganish</button>
        </div>
      </div>`;
  }

  // ── Config modal ────────────────────────────────────────────────────────
  function openConfig() {
    document.getElementById('api-key-input').value  = config.apiKey;
    document.getElementById('model-select').value   = config.model;
    document.getElementById('system-input').value   = config.system;
    document.getElementById('config-modal').classList.add('open');
  }
  function closeConfig() {
    document.getElementById('config-modal').classList.remove('open');
  }
  function saveConfig() {
    config.apiKey = document.getElementById('api-key-input').value.trim();
    config.model  = document.getElementById('model-select').value;
    config.system = document.getElementById('system-input').value.trim();
    localStorage.setItem('groq_key',    config.apiKey);
    localStorage.setItem('groq_model',  config.model);
    localStorage.setItem('groq_system', config.system);

    // Update badge
    const names = {
      'llama-3.1-8b-instant':    '⚡ Llama 3.1 8B',
      'llama-3.1-70b-versatile': '🧠 Llama 3.1 70B',
      'llama3-8b-8192':          '🚀 Llama 3 8B',
      'mixtral-8x7b-32768':      '🌀 Mixtral 8x7B',
      'gemma2-9b-it':            '💎 Gemma 2 9B',
    };
    document.querySelector('.model-badge').textContent = names[config.model] || config.model;
    closeConfig();
    showToast('✅ Sozlamalar saqlandi!');
  }

  // ── Toast ────────────────────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
  }

  // ── Click outside modal ──────────────────────────────────────────────────
  document.getElementById('config-modal').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeConfig();
  });

  // ── Init ────────────────────────────────────────────────────────────────
  if (config.apiKey) {
    const names = {
      'llama-3.1-8b-instant':    '⚡ Llama 3.1 8B',
      'llama-3.1-70b-versatile': '🧠 Llama 3.1 70B',
      'llama3-8b-8192':          '🚀 Llama 3 8B',
      'mixtral-8x7b-32768':      '🌀 Mixtral 8x7B',
      'gemma2-9b-it':            '💎 Gemma 2 9B',
    };
    document.querySelector('.model-badge').textContent = names[config.model] || config.model;
  }

  textarea.focus();
</script>
</body>
